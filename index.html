<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#09090d">
<title>MELSTROY: Побег от Интерпола — Мультиплеер</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090d;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#17151d;image-rendering:pixelated}
#ui{position:fixed;top:10px;left:10px;z-index:5;pointer-events:none;text-shadow:2px 2px 3px #000;font-weight:bold;font-size:14px;line-height:1.35}
.panel{background:rgba(8,8,13,.78);border:1px solid #777;border-radius:9px;padding:8px 10px;min-width:180px}
.hpOuter{height:13px;background:#390d12;border:1px solid #ddd;border-radius:5px;overflow:hidden;margin:4px 0 7px}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#e21d2b,#ff7a35)}
#rageOuter{height:8px;background:#321015;border:1px solid #a33;border-radius:4px;overflow:hidden;margin-top:3px}
#rageFill{height:100%;width:0;background:linear-gradient(90deg,#f22,#ffb000)}
#stats{display:none}
#task,#pause{display:none!important}
#task{position:fixed;right:10px;top:10px;z-index:5;background:#09090ddd;border:1px solid #aaa;border-radius:9px;padding:9px 12px;font-weight:bold}
#pause{position:fixed;right:12px;top:78px;z-index:7;border:1px solid #aaa;background:#17151dcc;color:#fff;border-radius:10px;padding:10px 14px;font-size:20px}
#mobileControls{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid #ddd9;background:#ffffff20;pointer-events:auto;touch-action:none;box-shadow:0 0 18px #0008;display:none;transform:translate(-50%,-50%)}
#joyStick{position:absolute;left:32px;top:32px;width:56px;height:56px;border-radius:50%;background:#e32939dd;border:3px solid #fff;box-shadow:0 0 14px #e22;pointer-events:none;transform:translate(0,0)}
#fireButton{display:none}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#050508eF;padding:20px;text-align:center}
#dialog{max-width:600px;background:#15131b;border:2px solid #b33;border-radius:16px;padding:26px;box-shadow:0 0 45px #e22255aa}
h1{color:#ff414b;margin:0 0 12px;font-size:clamp(27px,6vw,44px);text-shadow:0 0 20px #f22}
p{color:#ddd;line-height:1.55}
button{cursor:pointer}
.btn-main{border:0;border-radius:9px;background:#e22;color:#fff;padding:14px 20px;font-weight:bold;font-size:18px;margin:5px}
.btn-secondary{border:2px solid #e22;background:transparent;color:#e22;border-radius:9px;padding:14px 20px;font-weight:bold;font-size:18px;margin:5px}
#start:active,#pause:active{transform:scale(.97)}
.hidden{display:none!important}

/* ---- Leaderboard ---- */
#leaderboard{position:fixed;top:10px;right:10px;z-index:5;background:rgba(8,8,13,.85);border:1px solid #a33;border-radius:10px;padding:8px 12px;min-width:190px;font-size:12px;pointer-events:none;box-shadow:0 0 20px #e2225566}
#leaderboard h3{margin:0 0 6px;color:#ff414b;font-size:14px;text-align:center;text-shadow:0 0 10px #f22}
.lb-row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid #ffffff15}
.lb-row.me{color:#ffe66b;font-weight:bold}
.lb-row .lb-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.lb-row .lb-score{color:#ff9}
#playerList{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(8,8,13,.8);border:1px solid #777;border-radius:9px;padding:6px 12px;font-size:11px;display:flex;gap:10px;pointer-events:none;max-width:90vw;overflow-x:auto}
.pl-item{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pl-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;box-shadow:0 0 6px #4caf50}
.pl-item.bot .pl-dot{background:#ff9800;box-shadow:0 0 6px #ff9800}
.pl-item.me .pl-dot{background:#e22;box-shadow:0 0 8px #e22}
.pl-item .pl-hp{width:30px;height:4px;background:#400;border-radius:2px;overflow:hidden}
.pl-item .pl-hp-fill{height:100%;background:#4caf50;transition:width .2s}
#nameInput{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:#15131b;border:2px solid #b33;border-radius:12px;padding:20px;text-align:center;display:none}
#nameInput input{background:#09090d;border:1px solid #777;color:#fff;padding:8px 12px;border-radius:6px;font-size:16px;margin:10px 0;text-align:center;width:200px}
#nameInput button{border:0;border-radius:6px;background:#e22;color:#fff;padding:8px 20px;font-weight:bold;cursor:pointer}
#connStatus{position:fixed;bottom:10px;right:10px;z-index:5;font-size:11px;padding:4px 8px;border-radius:6px;background:#222;color:#aaa}
#connStatus.online{background:#1b3a1b;color:#6f6}
#connStatus.offline{background:#3a1b1b;color:#f66}
#waveInfo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;font-size:40px;font-weight:bold;color:#fff;text-shadow:0 0 20px #f22;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#waveInfo.show{opacity:1}
/* Minimap */
#minimapCanvas{position:fixed;top:110px;left:15px;z-index:7;width:150px;height:150px;border-radius:50%;border:3px solid #e22;box-shadow:0 0 15px #000;background:#111a}
@media (pointer:coarse){
#mobileControls{display:block}
#ui{font-size:12px;top:8px;left:8px}
.panel{min-width:150px;padding:6px 8px}
#task{font-size:12px;max-width:145px}
#leaderboard{font-size:10px;padding:5px 8px;min-width:140px}
#leaderboard .lb-row .lb-name{max-width:80px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimapCanvas" width="150" height="150"></canvas>

<!-- HP бар слева сверху, карта под ним -->
<div id="ui">
<div class="panel hpPanel">
<div>❤️ HP: <span id="hpText">100</span></div>
<div class="hpOuter"><div id="hpFill"></div></div>
<div>⚔️ Счёт: <span id="scoreText">0</span></div>
</div>
</div>
<button id="pause" type="button" aria-label="Пауза">Ⅱ</button>

<!-- Таблица лидеров -->
<div id="leaderboard">
<h3>🏆 ТОП ИГРОКОВ</h3>
<div id="lbList"></div>
</div>

<!-- Список игроков в лобби -->
<div id="playerList"></div>

<!-- Статус соединения -->
<div id="connStatus" class="offline">○ оффлайн</div>

<!-- Индикатор волны -->
<div id="waveInfo"></div>

<!-- Ввод имени -->
<div id="nameInput">
<div style="color:#ff414b;font-size:20px;font-weight:bold;margin-bottom:8px">ВВЕДИ НИК</div>
<input id="nickInput" maxlength="16" placeholder="Мелстрой228" autocomplete="off">
<br>
<button id="nickOk">ПРОДОЛЖИТЬ</button>
</div>

<div id="mobileControls">
<div id="joyBase"><div id="joyStick"></div></div>
</div>

<div id="overlay">
<div id="dialog">
<h1>MELSTROY: ПОБЕГ</h1>
<p>Ты — Мелстрой в тазике. Интерпол наступает со всех сторон! Собирай шляпы, качай Котость, атакуй агентов!</p>
<p>🎮 <b>Выбери режим:</b><br>Соло — волны врагов, прокачка, никаких ботов.<br>Мультиплеер — играй с друзьями.</p>
<button class="btn-main" id="btnSolo">СОЛО (ВОЛНЫ)</button>
<button class="btn-secondary" id="btnMulti">МУЛЬТИПЛЕЕР</button>
</div>
</div>

// Динамический джойстик
let joy={x:0,y:0,active:false,id:null,startX:0,startY:0};
const jb=$('joyBase'),js=$('joyStick');
function updateJoy(e){
  if(!joy.active||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.startX;
  let dy=e.clientY-joy.startY;
  let dist=Math.hypot(dx,dy),max=43;
  if(dist>max){dx*=max/dist;dy*=max/dist}
  joy.x=dx/max;joy.y=dy/max;
  js.style.transform=`translate(${dx}px, ${dy}px)`;
}
canvas.addEventListener('pointerdown', e=>{
  if(!mobile || e.clientX > vw/2) return;
  if(joy.active) return;
  joy.active=true;joy.id=e.pointerId;joy.startX=e.clientX;joy.startY=e.clientY;
  jb.style.display='block';
  jb.style.left=e.clientX+'px';
  jb.style.top=e.clientY+'px';
  updateJoy(e);
});
canvas.addEventListener('pointermove', e=>{ updateJoy(e); });
function endJoy(e){
  if(e.pointerId!==joy.id)return;
  joy.active=false;joy.id=null;joy.x=joy.y=0;
  jb.style.display='none';
  js.style.transform='translate(0,0)';
}
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);

// ============ МУЛЬТИПЛЕЕР (FIREBASE) ============
const SERVER_NAME = 'melstroy-room-1';
let myId = Math.random().toString(36).slice(2, 10);
let playerName = localStorage.getItem('melstroy_nick') || 'Игрок';
let remotePlayers = new Map();
let fb = window.fb;
let playerRef = null;
let isOnline = false;

function initMultiplayer() {
  if (!fb) return;
  playerRef = fb.ref(fb.db, 'players/' + myId);
  fb.onDisconnect(playerRef).remove();
  const allPlayersRef = fb.ref(fb.db, 'players');
  fb.onValue(allPlayersRef, (snapshot) => {
    const data = snapshot.val() || {};
    const now = performance.now();
    for (const [id, p] of Object.entries(data)) {
      if (id === myId) continue;
      remotePlayers.set(id, {
        x: p.x || 0, y: p.y || 0, hp: p.hp || 100,
        name: p.name || '???', lastSeen: now
      });
    }
    for (const id of remotePlayers.keys()) {
      if (!data[id]) remotePlayers.delete(id);
    }
    updatePlayerList();
  });
  isOnline = true;
  $('connStatus').textContent = '● онлайн (Firebase)';
  $('connStatus').className = 'online';
}

let lastSync = 0;
function syncState(time) {
  if (!playerRef || !game || !isOnline) return;
  if (time - lastSync < 100) return;
  lastSync = time;
  fb.set(playerRef, {
    x: Math.round(game.p.x),
    y: Math.round(game.p.y),
    hp: Math.ceil(game.p.hp),
    name: playerName
  }).catch(e => console.warn('Firebase sync error', e));
}

function cleanupRemote() {
  const now = performance.now();
  for (const [id, p] of remotePlayers) {
    if (now - p.lastSeen > 5000) remotePlayers.delete(id);
  }
}

let leaderboard = [];
function loadLeaderboard(){ try { leaderboard = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch(e){ leaderboard = []; } }
function saveLeaderboard(){ try { localStorage.setItem(LS_KEY, JSON.stringify(leaderboard.slice(0,20))); } catch(e){} }
function addScore(name, score){
  leaderboard.push({name, score, ts: Date.now()});
  leaderboard.sort((a,b)=>b.score-a.score);
  leaderboard = leaderboard.slice(0,20);
  saveLeaderboard();
  renderLeaderboard();
}
function renderLeaderboard(){
  const el = $('lbList');
  if (!leaderboard.length) { el.innerHTML = '<div style="color:#888;text-align:center;padding:4px">Пока пусто</div>'; return; }
  el.innerHTML = leaderboard.slice(0,10).map((e,i)=>{
    const isMe = e.name === playerName;
    return `<div class="lb-row${isMe?' me':''}"><span>${i+1}. <span class="lb-name">${e.name}</span></span><span class="lb-score">${e.score}</span></div>`;
  }).join('');
}
loadLeaderboard();
renderLeaderboard();

// ============ ИГРОВАЯ ЛОГИКА ============
let game=null,running=false,paused=false,last=0,raf=0;
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function startGame(mode){
  if (!playerName || playerName === 'Игрок') { $('nameInput').style.display = 'block'; return; }
  initAudio(); stopMusic(); playMeme('start');
  setTimeout(()=>{ if(running){ memeAudio.music.currentTime=0; memeAudio.music.play().catch(()=>{}); } }, 900);
  $('overlay').classList.add('hidden');
  $('nameInput').style.display = 'none';
  $('waveInfo').classList.remove('show');
  playerName = localStorage.getItem('melstroy_nick') || 'Игрок';
  if (playerName === 'Игрок') playerName = 'Мелстрой' + Math.floor(Math.random()*1000);

  game={
    mode: mode, // 'solo' или 'multi'
    p:{x:0,y:0,r:23,hp:100,maxHp:100,speed:245,inv:0,rage:0,rageOn:false,shield:0,face:0,boost:0,hatSpeed:1},
    enemies:[],bullets:[],pickups:[],particles:[],texts:[],bosses:[],
    weapons:[{type:'hat',count:1,a:0}],cat:null,birds:0,time:0,kills:0,level:1,spawn:0,
    cam:{x:0,y:0},shake:0,fireCd:0,
    wave:1, waveTimer:0, waveActive:false, waveEnemies:0
  };
  
  if (mode === 'multi') {
    initMultiplayer();
    $('leaderboard').style.display = 'block';
    $('playerList').style.display = 'flex';
  } else {
    $('leaderboard').style.display = 'none';
    $('playerList').style.display = 'none';
    $('connStatus').style.display = 'none';
    startWave();
  }

  running=true; paused=false; $('pause').textContent='Ⅱ'; last=0;
  cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
}

function startWave() {
  game.waveActive = true;
  game.waveEnemies = 5 + game.wave * 3;
  game.enemies = [];
  const info = $('waveInfo');
  info.textContent = `ВОЛНА ${game.wave}`;
  info.classList.add('show');
  setTimeout(()=>info.classList.remove('show'), 2000);
  
  for (let i=0; i<game.waveEnemies; i++) {
    setTimeout(() => {
      if (running && game.mode === 'solo') spawnEnemy();
    }, i * 300);
  }
  
  if (game.wave % 5 === 0) {
    setTimeout(() => {
      if (running && game.mode === 'solo') spawnBoss();
    }, 1500);
  }
}

$('btnSolo').addEventListener('click', ()=>{
  if (!playerName || playerName === 'Игрок') { $('nameInput').style.display = 'block'; return; }
  startGame('solo');
});
$('btnMulti').addEventListener('click', ()=>{
  if (!playerName || playerName === 'Игрок') { $('nameInput').style.display = 'block'; return; }

});

  const nick = $('nickInput').value.trim() || 'Мелстрой'+Math.floor(Math.random()*1000);
  playerName = nick; localStorage.setItem('melstroy_nick', nick);
  $('nameInput').style.display='none';

  $('btnSolo').addEventListener('click', ()=>startGame('solo'));

$('pause').addEventListener('click',()=>{
  if(!game||!running)return;
  paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';
  if(paused){memeAudio.music.pause()} else{memeAudio.music.play().catch(()=>{});last=0;raf=requestAnimationFrame(loop)}

// ============ ВРАГИ ============
function spawnEnemy(){
  let p=game.p,ang=rand(0,Math.PI*2),r=rand(Math.max(vw,vh)*.55,Math.max(vw,vh)*.8);
  let types=[
    {r:16,hp:3,spd:95,dmg:8,c:'#426b9a',score:1},
    {r:20,hp:7,spd:72,dmg:12,c:'#315b91',score:2},
    {r:25,hp:14,spd:55,dmg:17,c:'#9c333d',score:3}
  ];
  let t=types[0];
  if(game.level>=3&&Math.random()<.3)t=types[1];
  if(game.level>=5&&Math.random()<.15)t=types[2];
  const scale=1+Math.floor(game.time/30)*.22;
  t={...t,hp:Math.ceil(t.hp*scale),spd:t.spd+Math.min(35,game.time*.12)};
  game.enemies.push({...t,x:p.x+Math.cos(ang)*r,y:p.y+Math.sin(ang)*r,maxHp:t.hp,hit:0,slow:0})
}

function spawnBoss(){
  let p=game.p,ang=rand(0,Math.PI*2),r=rand(Math.max(vw,vh)*.6,Math.max(vw,vh)*.8);
  game.bosses.push({
    x:p.x+Math.cos(ang)*r, y:p.y+Math.sin(ang)*r,
    r:40, hp:100+game.wave*20, maxHp:100+game.wave*20, spd:40, dmg:25,
    c:'#111', hit:0, slow:0, shootCd:0
  });
}

function update(dt){
  const g=game,p=g.p;
  g.time+=dt;g.level=1+Math.floor(g.time/25);
  
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup']||keys['ц'])dy--;
  if(keys['s']||keys['arrowdown']||keys['ы'])dy++;
  if(keys['a']||keys['arrowleft']||keys['ф'])dx--;
  if(keys['d']||keys['arrowright']||keys['в'])dx++;
  if(joy.active){dx=joy.x;dy=joy.y}
  let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  let boostMultiplier=p.boost>0?1.5:1;
  p.x+=dx*p.speed*dt*(p.rageOn?1.15:1)*boostMultiplier;
  p.y+=dy*p.speed*dt*(p.rageOn?1.15:1)*boostMultiplier;
  p.face=Math.atan2(dy,dx);p.inv=Math.max(0,p.inv-dt);p.boost=Math.max(0,p.boost-dt);
  p.hatSpeed=Math.max(1, p.hatSpeed - dt*0.1);

  g.cam.x+=(p.x-g.cam.x)*Math.min(1,dt*7);g.cam.y+=(p.y-g.cam.y)*Math.min(1,dt*7);

  if (g.mode === 'solo') {
    if (g.waveActive && g.enemies.length === 0 && g.bosses.length === 0) {
      g.waveActive = false;
      g.waveTimer = 5;
      const info = $('waveInfo');
      info.textContent = `ВОЛНА ${g.wave} ПРОЙДЕНА! +HP`;
      p.hp = Math.min(p.maxHp, p.hp + 30);
      info.classList.add('show');
      setTimeout(()=>info.classList.remove('show'), 2000);
    }
    if (!g.waveActive && g.waveTimer > 0) {
      g.waveTimer -= dt;
      if (g.waveTimer <= 0) {
        g.wave++;
        startWave();
      }
    }
  } else {
    g.spawn-=dt;
    if(g.spawn<=0){
      g.spawn=Math.max(.24,1.25-g.level*.065);spawnEnemy();
      const extra=Math.min(5,Math.floor(g.time/45));
      for(let n=0;n<extra;n++)spawnEnemy();
      if(g.level>4&&Math.random()<.55)spawnEnemy()
    }
  }

  for(let w of g.weapons){
    if(w.type==='hat'){
      w.a+=dt*2.8*p.hatSpeed;
      const count=Math.min(30,w.count);
      const radius=155+Math.min(65,count*3);
      for(let k=0;k<count;k++){
        const a=w.a+k*Math.PI*2/count;
        const hx=p.x+Math.cos(a)*radius,hy=p.y+Math.sin(a)*radius;
        for(const e of [...g.enemies, ...g.bosses]){
          if(Math.hypot(e.x-hx,e.y-hy)<e.r+24){e.hp-=dt*23;e.hit=.08}
        }
      }
    }
  }

  if(g.cat){
    let c=g.cat;
    c.x+=(p.x-55-c.x)*Math.min(1,dt*4);
    c.y+=(p.y+48-c.y)*Math.min(1,dt*4);
    c.cd-=dt;
    if(c.cd<=0){
      c.cd=Math.max(.55,2.4-(c.level-1)*.22);
      let e=nearestEnemy(c,620);
      if(e)shoot(c,e,2+(c.level-1)*1.5,'#ffc04a')
    }
  }

  for(let i=g.bullets.length-1;i>=0;i--){
    let b=g.bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;
    let hit=false;
    for(let e of [...g.enemies, ...g.bosses]){
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        e.hp-=b.d;particles(b.x,b.y,b.c,5);hit=true;break
      }
    }
    if(hit||b.t<=0)g.bullets.splice(i,1)
  }

  for(let i=g.enemies.length-1;i>=0;i--){
    let e=g.enemies[i],d=dist(e,p)||1;
    e.x+=(p.x-e.x)/d*e.spd*dt*(e.slow?0.5:1);
    e.y+=(p.y-e.y)/d*e.spd*dt*(e.slow?0.5:1);
    e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);
    if(d<e.r+p.r&&p.inv<=0){
      let dmg=e.dmg;
      if(p.shield>0){let absorbed=Math.min(p.shield,dmg);p.shield-=absorbed;dmg-=absorbed}
      if(dmg>0){p.hp-=dmg*(p.rageOn?.7:1);playMeme('hurt');text(p.x,p.y-30,'-'+Math.round(dmg),'#ff5555');g.shake=7}
      p.inv=.55;
      if(g.birds>0){g.birds--;text(p.x,p.y-48,'🐦 защитил!','#ffe45c')}
    }
    if(e.hp<=0){
      g.kills++;particles(e.x,e.y,e.c,12);
      if(Math.random()<.22)spawnPickup(e.x,e.y,pickupTypes[Math.floor(Math.random()*pickupTypes.length)]);
      g.enemies.splice(i,1)
    }
  }

  for(let i=g.bosses.length-1;i>=0;i--){
    let b=g.bosses[i],d=dist(b,p)||1;
    b.x+=(p.x-b.x)/d*b.spd*dt;
    b.y+=(p.y-b.y)/d*b.spd*dt;
    b.hit=Math.max(0,b.hit-dt);
    b.shootCd -= dt;
    
    if (b.shootCd <= 0 && d < 500) {
      b.shootCd = 1.5;
      let a = Math.atan2(p.y-b.y, p.x-b.x);
      g.bullets.push({ x:b.x, y:b.y, vx:Math.cos(a)*300, vy:Math.sin(a)*300, t:2, d:10, c:'#ff0', r:8, fromBoss: true });
    }

    if(d<b.r+p.r&&p.inv<=0){
      let dmg=b.dmg;
      if(p.shield>0){let absorbed=Math.min(p.shield,dmg);p.shield-=absorbed;dmg-=absorbed}
      if(dmg>0){p.hp-=dmg*(p.rageOn?.7:1);playMeme('hurt');text(p.x,p.y-30,'-'+Math.round(dmg),'#ff5555');g.shake=7}
      p.inv=.8;
    }
    if(b.hp<=0){
      g.kills+=10;particles(b.x,b.y,'#f00',30);
      spawnPickup(b.x,b.y,'heal');
      spawnPickup(b.x,b.y,'shield');
      spawnPickup(b.x,b.y,'hat');
      g.bosses.splice(i,1)
    }
  }

  for(let i=g.pickups.length-1;i>=0;i--){
    let q=g.pickups[i];q.t-=dt;q.phase+=dt*4;
    if(q.t<=0){g.pickups.splice(i,1);continue}
    if(dist(q,p)<p.r+22){collect(q);g.pickups.splice(i,1)}
  }
  
  for(let a of [g.particles,g.texts]){
    for(let i=a.length-1;i>=0;i--){
      let z=a[i];z.t-=dt;
      if(z.vx!==undefined){z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.96;z.vy*=.96}
      else z.y-=24*dt;
      if(z.t<=0)a.splice(i,1)
    }
  }
  g.shake=Math.max(0,g.shake-dt*25);
  
  syncState(performance.now());
  cleanupRemote();

  if(p.hp<=0){p.hp=0;running=false;gameOver()}
  updateUI();
}

const pickupTypes=['hat','hat','hat','cat','mamaBird','speed','heal','shield','xp','chekushka','fan'];
function spawnPickup(x,y,type){game.pickups.push({x,y,type,t:18,phase:rand(0,6)})}
function nearestEnemy(o,max){let best=null,bd=max;for(let e of [...game.enemies, ...game.bosses]){let d=dist(o,e);if(d<bd){bd=d;best=e}}return best}
function shoot(o,e,dmg,c){let a=Math.atan2(e.y-o.y,e.x-o.x);game.bullets.push({x:o.x,y:o.y,vx:Math.cos(a)*480,vy:Math.sin(a)*480,t:1.4,d:dmg,c,r:6})}

function collect(q){
  let g=game,p=g.p;
  if(q.type!=='heal')playMeme('pick');
  let w=g.weapons.find(x=>x.type===q.type);
  if(q.type==='hat'){
    if(!w)g.weapons.push(w={type:'hat',count:0,a:rand(0,6)});
    w.count=Math.min(30,w.count+1);
    text(q.x,q.y,'ШЛЯПА +1  ('+w.count+')','#e9a8bd')
  }
  else if(q.type==='chekushka'){p.boost=10;text(q.x,q.y,'БУСТ СКОРОСТИ: 10 СЕКУНД!','#ffe66b')}
  else if(q.type==='cat'){if(g.cat)g.cat.level++;else g.cat={x:p.x,y:p.y,level:1,cd:1.5};text(q.x,q.y,'КОТОСТЬ! 🐈','#ffc45c')}
  else if(q.type==='mamaBird'){g.birds+=3;text(q.x,q.y,'МАМА ПТИЦА +3','#ffe66b')}
  else if(q.type==='speed'){p.speed=Math.min(360,p.speed+25);text(q.x,q.y,'СКОРОСТЬ +','#ffe66b')}
  else if(q.type==='heal'){p.hp=Math.min(p.maxHp,p.hp+28);text(q.x,q.y,'МЁД ПО ТЕЛУ +HP','#8f8');memeSound('heal')}
  else if(q.type==='shield'){p.shield=Math.min(100,p.shield+45);text(q.x,q.y,'ЩИТ +45','#7bdcff')}
  else if(q.type==='xp'){g.kills+=2;text(q.x,q.y,'+2 к счёту','#ffe66b')}
  else if(q.type==='fan'){p.hatSpeed=2.5;text(q.x,q.y,'ВЕНТИЛЯТОР! ВРАЩЕНИЕ x2.5','#8cf');}
  particles(q.x,q.y,'#ffe66b',12)
}

function updateUI(){
  let p=game.p;
  $('hpText').textContent=Math.ceil(p.hp);
  $('hpFill').style.width=(p.hp/p.maxHp*100)+'%';
  $('scoreText').textContent = game.kills;
  updatePlayerList();
}

function updatePlayerList(){
  if (game.mode === 'solo') return;
  const el = $('playerList');
  if (!game) { el.innerHTML = ''; return; }
  let html = `<div class="pl-item me"><span class="pl-dot"></span><span>${playerName} (вы)</span><span class="pl-hp"><span class="pl-hp-fill" style="width:${Math.max(0,game.p.hp/game.p.maxHp*100)}%;background:#e22"></span></span></div>`;
  for (const [id, rp] of remotePlayers) {
    html += `<div class="pl-item"><span class="pl-dot"></span><span>${rp.name}</span><span class="pl-hp"><span class="pl-hp-fill" style="width:${Math.max(0,rp.hp/100*100)}%"></span></span></div>`;
  }
  el.innerHTML = html;
}

// ============ МИНИ-КАРТА ============
function drawMinimap() {
  if (!game) return;
  const w = 150, h = 150, cx = w/2, cy = h/2, r = 65;
  mmCtx.clearRect(0, 0, w, h);
  
  mmCtx.fillStyle = '#111';
  mmCtx.beginPath(); mmCtx.arc(cx, cy, r+3, 0, Math.PI*2); mmCtx.fill();
  mmCtx.fillStyle = '#222';
  mmCtx.beginPath(); mmCtx.arc(cx, cy, r, 0, Math.PI*2); mmCtx.fill();
  mmCtx.strokeStyle = '#444';
  mmCtx.lineWidth = 1;
  mmCtx.stroke();

  const scale = 0.15;
  const p = game.p;
  
  mmCtx.fillStyle = '#888';
  for (const e of game.enemies) {
    const dx = (e.x - p.x) * scale;
    const dy = (e.y - p.y) * scale;
    if (Math.hypot(dx, dy) < r) {
      mmCtx.beginPath(); mmCtx.arc(cx + dx, cy + dy, 1.5, 0, Math.PI*2); mmCtx.fill();
    }
  }
  
  mmCtx.fillStyle = '#f00';
  for (const b of game.bosses) {
    const dx = (b.x - p.x) * scale;
    const dy = (b.y - p.y) * scale;
    if (Math.hypot(dx, dy) < r) {
      mmCtx.beginPath(); mmCtx.arc(cx + dx, cy + dy, 4, 0, Math.PI*2); mmCtx.fill();
    }
  }
  
  mmCtx.fillStyle = '#4af';
  for (const [id, rp] of remotePlayers) {
    const dx = (rp.x - p.x) * scale;
    const dy = (rp.y - p.y) * scale;
    if (Math.hypot(dx, dy) < r) {
      mmCtx.beginPath(); mmCtx.arc(cx + dx, cy + dy, 3, 0, Math.PI*2); mmCtx.fill();
    }
  }

  mmCtx.fillStyle = '#ffe66b';
  mmCtx.beginPath(); mmCtx.arc(cx, cy, 3, 0, Math.PI*2); mmCtx.fill();
  const face = game.p.face || 0;
  mmCtx.strokeStyle = '#ffe66b'; mmCtx.lineWidth = 2;
  mmCtx.beginPath(); mmCtx.moveTo(cx, cy); mmCtx.lineTo(cx + Math.cos(face)*8, cy + Math.sin(face)*8); mmCtx.stroke();
}

// ============ ОТРИСОВКА ============
function draw(){
  let g=game,p=g.p;
  ctx.clearRect(0,0,vw,vh);
  let shake=g.shake;
  ctx.save();
  if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));
  ctx.translate(vw/2-g.cam.x,vh/2-g.cam.y);
  
  let left=g.cam.x-vw/2-100,right=g.cam.x+vw/2+100,top=g.cam.y-vh/2-100,bottom=g.cam.y+vh/2+100;
  ctx.fillStyle='#24212b';ctx.fillRect(left,top,right-left,bottom-top);
  ctx.strokeStyle='#302c37';ctx.lineWidth=1;
  for(let x=Math.floor(left/48)*48;x<right;x+=48){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke()}
  for(let y=Math.floor(top/48)*48;y<bottom;y+=48){ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke()}
  for(let x=Math.floor(left/280)*280;x<right;x+=280){ctx.fillStyle='#3a3540';ctx.fillRect(x,top,3,bottom-top)}
  for(let i=-2;i<Math.ceil((right-left)/190)+2;i++)
    for(let j=-2;j<Math.ceil((bottom-top)/190)+2;j++){
      let x=Math.floor(left/190)*190+i*190+55,y=Math.floor(top/190)*190+j*190+60;
      ctx.fillStyle='#39343c';ctx.fillRect(x,y,24,15);ctx.fillStyle='#4a4145';ctx.fillRect(x+4,y+3,13,8)
    }

  const icons={chekushka:'🍾',cat:'🐈',mamaBird:'🐦',speed:'⚡',heal:'❤️',shield:'🛡️',xp:'⭐',fan:'🌀'};
  for(let q of g.pickups){
    ctx.save();ctx.translate(q.x,q.y+Math.sin(q.phase)*5);
    ctx.shadowColor='#ffdc52';ctx.shadowBlur=18;
    if(q.type==='hat'&&hatSprite.complete)ctx.drawImage(hatSprite,-17,-20,34,40);
    else{ctx.font='30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(icons[q.type]||'⭐',0,0)}
    ctx.restore()
  }

  for(let w of g.weapons){
    if(w.type==='hat'){
      const count=Math.min(30,w.count),radius=155+Math.min(65,count*3);
      for(let k=0;k<count;k++){
        const a=w.a+k*Math.PI*2/count,x=p.x+Math.cos(a)*radius,y=p.y+Math.sin(a)*radius;
        ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);
        ctx.shadowColor='#d58aa8';ctx.shadowBlur=15;
        if(hatSprite.complete&&hatSprite.naturalWidth)ctx.drawImage(hatSprite,-18,-21,36,42);
        ctx.restore()
      }
    }
  }

  for(let i=0;i<g.birds;i++){
    let a=g.time*2+i*Math.PI*2/Math.max(1,g.birds);
    ctx.font='19px Arial';ctx.fillText('🐦',p.x+Math.cos(a)*43,p.y+Math.sin(a)*43)
  }
  for(let b of g.bullets){
    ctx.fillStyle=b.c;ctx.shadowColor=b.c;ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0
  }
  for(let e of g.enemies){
    ctx.save();ctx.translate(e.x,e.y);
    ctx.fillStyle='#1a1f2e';
    ctx.fillRect(-e.r*.65, -e.r*.2, e.r*1.3, e.r*1.2);
    ctx.fillStyle='#1a1f2e';
    ctx.fillRect(-e.r*.9, -e.r*.2, e.r*.25, e.r*.8);
    ctx.fillRect(e.r*.65, -e.r*.2, e.r*.25, e.r*.8);
    ctx.fillStyle='#e8b18e';
    ctx.beginPath();ctx.arc(0,-e.r*.5,e.r*.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(0,-e.r*.7,e.r*.55,Math.PI,0);ctx.fill();
    ctx.fillRect(-e.r*.55, -e.r*.7, e.r*1.1, e.r*.2);
    ctx.fillStyle='#ff0';
    ctx.beginPath();ctx.arc(0,-e.r*.6,e.r*.1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';
    ctx.fillRect(e.r*.4, e.r*.1, 2, e.r*.6);
    
    ctx.fillStyle='#300';ctx.fillRect(-e.r,-e.r*1.4,e.r*2,4);
    ctx.fillStyle='#e33';ctx.fillRect(-e.r,-e.r*1.4,e.r*2*Math.max(0,e.hp/e.maxHp),4);
    ctx.restore()
  }

  for(let b of g.bosses){
    ctx.save();ctx.translate(b.x,b.y);
    ctx.fillStyle='#000a';ctx.beginPath();ctx.ellipse(0,15,b.r*1.1,b.r*.6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#0a0a0a';
    ctx.fillRect(-b.r*.7, -b.r*.2, b.r*1.4, b.r*1.4);
    ctx.fillStyle='#333';
    ctx.fillRect(-b.r*.5, -b.r*.1, b.r*1.0, b.r*.9);
    ctx.fillStyle='#222';
    ctx.beginPath();ctx.arc(0,-b.r*.6,b.r*.55,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';
    ctx.fillRect(-b.r*.4, -b.r*.7, b.r*.8, b.r*.3);
    ctx.fillStyle='#f00';
    ctx.beginPath();ctx.arc(-b.r*.2,-b.r*.6,b.r*.08,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(b.r*.2,-b.r*.6,b.r*.08,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#555';
    ctx.fillRect(b.r*.4, -b.r*.1, b.r*.6, b.r*.15);
    ctx.fillRect(b.r*.8, -b.r*.2, b.r*.1, b.r*.3);
    
    ctx.fillStyle='#300';ctx.fillRect(-b.r,-b.r*1.8,b.r*2,6);
    ctx.fillStyle='#f22';ctx.fillRect(-b.r,-b.r*1.8,b.r*2*Math.max(0,b.hp/b.maxHp),6);
    ctx.fillStyle='#f22';ctx.font='bold 10px Arial';ctx.textAlign='center';
    ctx.fillText('СПЕЦНАЗ', 0, -b.r*1.9);
    ctx.restore()
  }

  if (game.mode === 'multi') {
    for (const [id, rp] of remotePlayers) {
      if (!game) continue;
      ctx.save();ctx.translate(rp.x, rp.y);
      ctx.fillStyle='#09080d99';ctx.beginPath();ctx.ellipse(0,13,24,10,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#4a90d9';ctx.beginPath();ctx.ellipse(0,5,22,14,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e8b18e';ctx.beginPath();ctx.arc(0,-12,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#7df';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(rp.name || '???', 0, -34);
      ctx.fillStyle='#300';ctx.fillRect(-20,-24,40,4);ctx.fillStyle='#4a90d9';ctx.fillRect(-20,-24,40*Math.max(0,Math.min(1,rp.hp/100)),4);
      ctx.restore();
    }
  }

  if(g.cat){
    ctx.save();ctx.translate(g.cat.x,g.cat.y);
    if(catSprite.complete&&catSprite.naturalWidth)ctx.drawImage(catSprite,-31,-34,62,68);
    else{ctx.font='32px Arial';ctx.textAlign='center';ctx.fillText('🐈',0,10)}
    ctx.restore();
    ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillStyle='#ffcf70';
    ctx.fillText('КОТОСТЬ LVL '+g.cat.level,g.cat.x,g.cat.y-40)
  }

  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='#09080d99';ctx.beginPath();ctx.ellipse(0,13,27,12,0,0,Math.PI*2);ctx.fill();
  let bob=Math.sin(g.time*9)*2;
  if(p.inv>0&&Math.floor(p.inv*18)%2===0)ctx.globalAlpha=.35;
  if(sprite.complete&&sprite.naturalWidth){
    ctx.filter=p.hp/p.maxHp<.5?'saturate(3) sepia(1) hue-rotate(310deg) saturate(3)':'none';
    ctx.drawImage(sprite,-30,-43+bob,60,70);ctx.filter='none'
  }else{
    ctx.fillStyle=p.hp/p.maxHp<.5?'#d52b35':'#267bbd';
    ctx.beginPath();ctx.ellipse(0,5,25,15,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e8b18e';ctx.beginPath();ctx.arc(0,-13,14,0,Math.PI*2);ctx.fill()
  }
  if(p.shield>0){ctx.globalAlpha=.8;ctx.strokeStyle='#48cfff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke()}
  ctx.globalAlpha=1;ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(playerName, 0, -52);
  ctx.restore();ctx.globalAlpha=1;

  for(let z of g.particles){ctx.globalAlpha=Math.max(0,z.t/.65);ctx.fillStyle=z.c;ctx.beginPath();ctx.arc(z.x,z.y,3,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  for(let z of g.texts){ctx.globalAlpha=Math.max(0,z.t);ctx.fillStyle=z.c;ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(z.s,z.x,z.y)}
  ctx.globalAlpha=1;
  ctx.restore();

  drawMinimap();
}

function gameOver(){
  cancelAnimationFrame(raf);stopMusic();
  addScore(playerName, game.kills);
  if (playerRef) fb.remove(playerRef);
  $('overlay').classList.remove('hidden');
  $('dialog').innerHTML=`<h1>💀 ТЕБЯ ПОЙМАЛИ</h1><p>Интерпол окружил тазик Мелстроя!</p><p>⏱️ Продержался: <b>${Math.floor(game.time)}с</b><br>💀 Агентов побеждено: <b>${game.kills}</b><br>⭐ Уровень: <b>${game.level}</b></p><p>🏆 Твой счёт добавлен в таблицу лидеров!</p><button class="btn-main" id="btnSolo">СОЛО (ВОЛНЫ)</button><button class="btn-secondary" id="btnMulti">МУЛЬТИПЛЕЕР</button>`;
  $('btnSolo').addEventListener('click', ()=>startGame('solo'));
  $('btnMulti').addEventListener('click', ()=>startGame('multi'));
}
function loop(t){
  if(!running||paused)return;
  let dt=Math.min(.04,(t-last)/1000||.016);
  last=t;update(dt);
  if(running){draw();raf=requestAnimationFrame(loop)}
}
});
</script>
</body>
</html>
