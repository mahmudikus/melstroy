<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#09090d">
<title>MELSTROY: Побег от Интерпола</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090d;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#17151d;image-rendering:pixelated}
#ui{position:fixed;top:10px;left:10px;z-index:5;pointer-events:none;text-shadow:2px 2px 3px #000;font-weight:bold;font-size:14px;line-height:1.35}
.panel{background:rgba(8,8,13,.78);border:1px solid #777;border-radius:9px;padding:8px 10px;min-width:174px}
.hpOuter{height:13px;background:#390d12;border:1px solid #ddd;border-radius:5px;overflow:hidden;margin:4px 0 7px}
#hpFill{height:100%;width:100%;background:linear-gradient(90deg,#e21d2b,#ff7a35)}
#pause{position:fixed;right:12px;top:78px;z-index:7;border:1px solid #aaa;background:#17151dcc;color:#fff;border-radius:10px;padding:10px 14px;font-size:20px;pointer-events:auto;display:none}
#mobileControls{position:fixed;inset:0;z-index:6;pointer-events:none}
.joy-base{position:absolute;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,0.3);background:rgba(255,255,255,0.1);pointer-events:none;transform:translate(-50%,-50%)}
.joy-stick{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:#e32939dd;border:3px solid #fff;box-shadow:0 0 14px #e22;transform:translate(-50%,-50%);pointer-events:none}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#050508eF;padding:20px;text-align:center}
#dialog{max-width:600px;background:#15131b;border:2px solid #b33;border-radius:16px;padding:26px;box-shadow:0 0 45px #e22255aa}
h1{color:#ff414b;margin:0 0 12px;font-size:clamp(27px,6vw,44px);text-shadow:0 0 20px #f22}
p{color:#ddd;line-height:1.55}
button{cursor:pointer}
.btn-start{border:0;border-radius:9px;background:#e22;color:#fff;padding:14px 30px;font-weight:bold;font-size:18px;width:100%;margin-bottom:10px}
.btn-multi{background:#444}
.btn-start:active,#pause:active{transform:scale(.97)}
.hidden{display:none!important}
#minimap{position:fixed;top:10px;left:10px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.3);z-index:4;pointer-events:none}
@media (pointer:coarse){
#pause{display:block}
#ui{font-size:12px;top:8px;left:8px}
.panel{min-width:150px;padding:6px 8px}
}
</style>
</head>

<canvas id="game"></canvas>
<canvas id="minimap" width="120" height="120"></canvas>
<div id="ui">
<div class="panel hpPanel">
<div>❤️ HP: <span id="hpText">100</span></div>
<div class="hpOuter"><div id="hpFill"></div></div>
</div>
</div>
<button id="pause" type="button" aria-label="Пауза">Ⅱ</button>
<div id="mobileControls"></div>
<div id="overlay">
<div id="dialog">
<h1>MELSTROY: ПОБЕГ</h1>
<p>Ты — Мелстрой в тазике. Интерпол наступает со всех сторон! Собирай шляпы, прокачивай Котость и выживай.</p>
<p><b>Управление:</b><br>ПК: WASD / Стрелки + Мышь<br>Телефон: Коснись экрана в любом месте для джойстика.</p>
<button id="startSingle" class="btn-start">ОДИНОЧНАЯ ИГРА</button>
<button id="startMulti" class="btn-start btn-multi">МУЛЬТИПЛЕЕР</button>
</div>

let joy={x:0,y:0,active:false,id:null,baseX:0,baseY:0};
const touchZone=$('mobileControls');
let joyBaseElem=null;
let joyStickElem=null;

function createJoy(x,y){
    if(joyBaseElem) joyBaseElem.remove();
    joyBaseElem=document.createElement('div');
    joyBaseElem.className='joy-base';
    joyStickElem=document.createElement('div');
    joyStickElem.className='joy-stick';
    joyBaseElem.appendChild(joyStickElem);
    joyBaseElem.style.left=x+'px';
    joyBaseElem.style.top=y+'px';
    touchZone.appendChild(joyBaseElem);
}

function updateJoy(clientX,clientY){
    if(!joy.active) return;
    let dx=clientX-joy.baseX;
    let dy=clientY-joy.baseY;
    let dist=Math.hypot(dx,dy);
    let max=40;
    if(dist>max){
        dx*=max/dist;
        dy*=max/dist;
    }
    joy.x=dx/max;
    joy.y=dy/max;
    if(joyStickElem){
        joyStickElem.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }
}

// ВАЖНО: вешаем обработчики на document, чтобы они работали всегда
document.addEventListener('pointerdown',e=>{
    if(!mobile) return;
    if(e.target.closest('#overlay') || e.target.closest('#pause')) return;
    if(joy.active) return;
    e.preventDefault();
    joy.active=true;
    joy.id=e.pointerId;
    joy.baseX=e.clientX;
    joy.baseY=e.clientY;
    createJoy(e.clientX, e.clientY);
    updateJoy(e.clientX, e.clientY);
},{passive:false});

document.addEventListener('pointermove',e=>{
    if(!joy.active || e.pointerId!==joy.id) return;
    e.preventDefault();
    updateJoy(e.clientX, e.clientY);
},{passive:false});

function endJoy(e){
    if(!joy.active || e.pointerId!==joy.id) return;
    joy.active=false;
    joy.id=null;
    joy.x=0;
    joy.y=0;
    if(joyBaseElem){ joyBaseElem.remove(); joyBaseElem=null; joyStickElem=null; }
}

document.addEventListener('pointerup',endJoy);
document.addEventListener('pointercancel',endJoy);

let game=null,running=false,paused=false,last=0,raf=0;
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function createBot(x,y){
    return {
        x:x, y:y, r:23, hp:100, maxHp:100, speed:200,
        inv:0, shield:0, hatSpeed:1,
        weapons:[{type:'hat',count:1,a:0}],
        cat:null, birds:0,
        targetX:x, targetY:y,
        changeTargetTimer:0,
        isBot:true
    };
}

function updateBot(bot,dt){
    bot.changeTargetTimer-=dt;
    if(bot.changeTargetTimer<=0){
        bot.changeTargetTimer=rand(2,5);
        let nearest=nearestEnemy(bot,500);
        if(nearest){
            bot.targetX=nearest.x;
            bot.targetY=nearest.y;
        } else {
            bot.targetX=game.p.x+rand(-300,300);
            bot.targetY=game.p.y+rand(-300,300);
        }
    }
    
    let dx=bot.targetX-bot.x;
    let dy=bot.targetY-bot.y;
    let l=Math.hypot(dx,dy);
    if(l>10){
        dx/=l; dy/=l;
        bot.x+=dx*bot.speed*dt;
        bot.y+=dy*bot.speed*dt;
    }
    
    bot.inv=Math.max(0,bot.inv-dt);
    
    for(let w of bot.weapons){
        if(w.type==='hat'){
            w.a+=dt*2.8*(bot.hatSpeed||1);
            const count=Math.min(30,w.count);
            const radius=155+Math.min(65,count*3);
            for(let k=0;k<count;k++){
                const a=w.a+k*Math.PI*2/count;
                const hx=bot.x+Math.cos(a)*radius;
                const hy=bot.y+Math.sin(a)*radius;
                for(const e of game.enemies){
                    if(Math.hypot(e.x-hx,e.y-hy)<e.r+24){
                        e.hp-=dt*23;e.hit=.08;
                    }
                }
            }
        }
    }
    
    if(bot.cat){
        let c=bot.cat;
        c.x+=(bot.x-55-c.x)*Math.min(1,dt*4);
        c.y+=(bot.y+48-c.y)*Math.min(1,dt*4);
        c.cd-=dt;
        if(c.cd<=0){
            c.cd=Math.max(.55,2.4-(c.level-1)*.22);
            let e=nearestEnemy(c,620);
            if(e){
                let a=Math.atan2(e.y-c.y,e.x-c.x);
                game.bullets.push({x:c.x,y:c.y,vx:Math.cos(a)*480,vy:Math.sin(a)*480,t:1.4,d:2+(c.level-1)*1.5,c:'#ffc04a',r:6});
            }
        }
    }
}

function startGame(mode){
initAudio();stopMusic();playMeme('start');
setTimeout(()=>{if(running){memeAudio.music.currentTime=0;memeAudio.music.play().catch(()=>{})}},900);
$('overlay').classList.add('hidden');
game={
mode: mode,
p:{x:0,y:0,r:23,hp:100,maxHp:100,speed:245,inv:0,rage:0,rageOn:false,shield:0,face:0,boost:0,hatSpeed:1},
enemies:[],bullets:[],pickups:[],particles:[],texts:[],
weapons:[{type:'hat',count:1,a:0}],cat:null,birds:0,time:0,kills:0,level:1,spawn:0,
cam:{x:0,y:0},shake:0,fireCd:0,
wave: 0, waveCooldown: 0, enemiesToSpawn: 0,
bots: mode==='multiplayer' ? [createBot(100,100),createBot(-100,-100),createBot(100,-100)] : []
};
running=true;paused=false;$('pause').textContent='Ⅱ';last=0;
cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)
}

$('startSingle').addEventListener('click',()=>startGame('singleplayer'));
$('startMulti').addEventListener('click',()=>startGame('multiplayer'));

$('pause').addEventListener('click',()=>{

paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';

else{memeAudio.music.play().catch(()=>{});last=0;raf=requestAnimationFrame(loop)}
});

function text(x,y,s,c='#fff'){game.texts.push({x,y,s,c,t:1.5})}
function particles(x,y,c,n=9){
for(let i=0;i<n;i++){
let a=rand(0,Math.PI*2),v=rand(35,180);
game.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:rand(.25,.65),c})
}
}

function spawnEnemy(){
let p=game.p,ang=rand(0,Math.PI*2),r=rand(Math.max(vw,vh)*.55,Math.max(vw,vh)*.8);
let isBoss = game.level >= 4 && Math.random() < 0.15;
let types=[
{r:16,hp:3,spd:95,dmg:8,c:'#1a237e',score:1, type:'police'},
{r:20,hp:7,spd:72,dmg:12,c:'#1a237e',score:2, type:'police'},
{r:32,hp:40,spd:65,dmg:25,c:'#212121',score:5, type:'boss'}
];
let t = isBoss ? types[2] : (game.level>=3&&Math.random()<.3 ? types[1] : types[0]);
const scale=1+Math.floor(game.time/30)*.22;
t={...t,hp:Math.ceil(t.hp*scale),spd:t.spd+Math.min(35,game.time*.12)};
game.enemies.push({...t,x:p.x+Math.cos(ang)*r,y:p.y+Math.sin(ang)*r,maxHp:t.hp,hit:0,slow:0})
}

const pickupTypes=['hat','hat','cat','mamaBird','speed','heal','shield','xp','chekushka','hatSpeed'];
function spawnPickup(x,y,type){game.pickups.push({x,y,type,t:18,phase:rand(0,6)})}

function update(dt){
const g=game,p=g.p;
g.time+=dt;g.level=1+Math.floor(g.time/25);

if(g.mode==='singleplayer'){
    if(g.enemies.length===0 && g.enemiesToSpawn<=0 && g.waveCooldown<=0){
        g.wave++;
        g.enemiesToSpawn=5+g.wave*3;
        g.waveCooldown=3.0;
        text(p.x,p.y-60,`⚠️ ВОЛНА ${g.wave} ⚠️`,'#ff414b');
        playMeme('rage');
    }
    if(g.waveCooldown>0){
        g.waveCooldown-=dt;
    } else if(g.enemiesToSpawn>0){
        g.spawn-=dt;
        if(g.spawn<=0){
            spawnEnemy();
            g.enemiesToSpawn--;
            g.spawn=Math.max(0.15,0.8-g.wave*0.05);
        }
    }
} else {
    g.spawn-=dt;
    if(g.spawn<=0){
        g.spawn=Math.max(.24,1.25-g.level*.065);spawnEnemy();
        const extra=Math.min(5,Math.floor(g.time/45));
        for(let n=0;n<extra;n++)spawnEnemy();
        if(g.level>4&&Math.random()<.55)spawnEnemy()
    }
}

for(let bot of g.bots){
    updateBot(bot,dt);
}

let dx=0,dy=0;
if(keys['w']||keys['arrowup']||keys['ц'])dy--;
if(keys['s']||keys['arrowdown']||keys['ы'])dy++;
if(keys['a']||keys['arrowleft']||keys['ф'])dx--;
if(keys['d']||keys['arrowright']||keys['в'])dx++;
if(mobile){dx=joy.x;dy=joy.y}
let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
let boostMultiplier=p.boost>0?1.5:1;
p.x+=dx*p.speed*dt*(p.rageOn?1.15:1)*boostMultiplier;
p.y+=dy*p.speed*dt*(p.rageOn?1.15:1)*boostMultiplier;
p.face=Math.atan2(dy,dx);
p.inv=Math.max(0,p.inv-dt);
p.boost=Math.max(0,p.boost-dt);

let hp=p.hp/p.maxHp;
if((hp<.3||p.rage>65)&&!p.rageOn){
p.rageOn=true;text(p.x,p.y-50,'Я УЖЕ КРАСНЫЙ!','#f44');
particles(p.x,p.y,'#f22',22);memeSound('rage')
}
if(p.rageOn){
p.rage=Math.min(100,p.rage+dt*13);
if(hp>.55&&p.rage>=100){p.rageOn=false;p.rage=35}
}else p.rage=Math.max(0,p.rage-dt*4);

g.cam.x+=(p.x-g.cam.x)*Math.min(1,dt*7);
g.cam.y+=(p.y-g.cam.y)*Math.min(1,dt*7);

for(let w of g.weapons){
if(w.type==='hat'){
w.a+=dt*2.8*(p.hatSpeed||1);
const count=Math.min(30,w.count);
const radius=155+Math.min(65,count*3);
for(let k=0;k<count;k++){
const a=w.a+k*Math.PI*2/count;
const hx=p.x+Math.cos(a)*radius,hy=p.y+Math.sin(a)*radius;
for(const e of g.enemies){
if(Math.hypot(e.x-hx,e.y-hy)<e.r+24){e.hp-=dt*23;e.hit=.08}
}
}
}
}

if(g.cat){
let c=g.cat;
c.x+=(p.x-55-c.x)*Math.min(1,dt*4);
c.y+=(p.y+48-c.y)*Math.min(1,dt*4);
c.cd-=dt;
if(c.cd<=0){
c.cd=Math.max(.55,2.4-(c.level-1)*.22);
let e=nearestEnemy(c,620);
if(e)shoot(c,e,2+(c.level-1)*1.5,'#ffc04a')
}
}

for(let i=g.bullets.length-1;i>=0;i--){
let b=g.bullets[i];
b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;
let hit=false;
for(let e of g.enemies){
if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
e.hp-=b.d;particles(b.x,b.y,b.c,5);hit=true;break
}
}
if(hit||b.t<=0)g.bullets.splice(i,1)
}

for(let i=g.enemies.length-1;i>=0;i--){
let e=g.enemies[i];
let closestTarget=p;
let minDist=dist(e,p);
for(let bot of g.bots){
    let d=dist(e,bot);
    if(d<minDist){
        minDist=d;
        closestTarget=bot;
    }
}
let d=dist(e,closestTarget)||1;
e.x+=(closestTarget.x-e.x)/d*e.spd*dt*(e.slow?0.5:1);
e.y+=(closestTarget.y-e.y)/d*e.spd*dt*(e.slow?0.5:1);
e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);
if(d<e.r+closestTarget.r&&closestTarget.inv<=0){
let dmg=e.dmg;
if(closestTarget.shield>0){let absorbed=Math.min(closestTarget.shield,dmg);closestTarget.shield-=absorbed;dmg-=absorbed}
if(dmg>0){
closestTarget.hp-=dmg;
if(closestTarget===p){
    playMeme('hurt');text(p.x,p.y-30,'-'+Math.round(dmg),'#ff5555');g.shake=7;
}
}
closestTarget.inv=.55;
if(closestTarget===p&&g.birds>0){g.birds--;text(p.x,p.y-48,'🐦 защитил!','#ffe45c')}
}
if(e.hp<=0){
g.kills++;particles(e.x,e.y,e.c,12);
if(Math.random()<.22)spawnPickup(e.x,e.y,pickupTypes[Math.floor(Math.random()*pickupTypes.length)]);
g.enemies.splice(i,1)
}
}

for(let i=g.pickups.length-1;i>=0;i--){
let q=g.pickups[i];q.t-=dt;q.phase+=dt*4;
if(q.t<=0){g.pickups.splice(i,1);continue}
if(dist(q,p)<p.r+22){collect(q);g.pickups.splice(i,1)}
}
for(let a of [g.particles,g.texts]){
for(let i=a.length-1;i>=0;i--){
let z=a[i];z.t-=dt;
if(z.vx!==undefined){z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.96;z.vy*=.96}
else z.y-=24*dt;
if(z.t<=0)a.splice(i,1)
}
}
g.shake=Math.max(0,g.shake-dt*25);
if(p.hp<=0){p.hp=0;running=false;gameOver()}
updateUI()
}

function nearestEnemy(o,max){
let best=null,bd=max;
for(let e of game.enemies){let d=dist(o,e);if(d<bd){bd=d;best=e}}
return best
}
function shoot(o,e,dmg,c){
let a=Math.atan2(e.y-o.y,e.x-o.x);
game.bullets.push({x:o.x,y:o.y,vx:Math.cos(a)*480,vy:Math.sin(a)*480,t:1.4,d:dmg,c,r:6})
}

function collect(q){
let g=game,p=g.p;
if(q.type!=='heal')playMeme('pick');
let w=g.weapons.find(x=>x.type===q.type);
if(q.type==='hat'){
if(!w)g.weapons.push(w={type:'hat',count:0,a:rand(0,6)});
w.count=Math.min(30,w.count+1);
text(q.x,q.y,'ШЛЯПА +1  ('+w.count+')','#e9a8bd')
}
else if(q.type==='chekushka'){
p.boost=10;
text(q.x,q.y,'БУСТ СКОРОСТИ: 10 СЕКУНД!','#ffe66b')
}
else if(q.type==='cat'){
if(g.cat)g.cat.level++;
else g.cat={x:p.x,y:p.y,level:1,cd:1.5};
text(q.x,q.y,'КОТОСТЬ! 🐈','#ffc45c')
}
else if(q.type==='mamaBird'){
g.birds+=3;text(q.x,q.y,'МАМА ПТИЦА +3','#ffe66b')
}
else if(q.type==='speed'){
p.speed=Math.min(360,p.speed+25);text(q.x,q.y,'СКОРОСТЬ +','#ffe66b')
}
else if(q.type==='heal'){
p.hp=Math.min(p.maxHp,p.hp+28);text(q.x,q.y,'МЁД ПО ТЕЛУ +HP','#8f8');memeSound('heal')
}
else if(q.type==='shield'){
p.shield=Math.min(100,p.shield+45);text(q.x,q.y,'ЩИТ +45','#7bdcff')
}
else if(q.type==='xp'){
g.kills+=2;text(q.x,q.y,'+2 к счёту','#ffe66b')
}
else if(q.type==='hatSpeed'){
p.hatSpeed=(p.hatSpeed||1)+0.5;
text(q.x,q.y,'СКОРОСТЬ ШЛЯП + 🌀','#00ffff')
}
particles(q.x,q.y,'#ffe66b',12)
}

function updateUI(){
let p=game.p;
$('hpText').textContent=Math.ceil(p.hp);
$('hpFill').style.width=(p.hp/p.maxHp*100)+'%'
}

ctx.fillRect(-e.r*0.55,-e.r*0.5,e.r*1.1,e.r*0.15);
ctx.fillStyle='#ffd700';
ctx.fillRect(-2,-e.r*0.65,4,4);

function drawBot(bot){
ctx.save();ctx.translate(bot.x,bot.y);
ctx.fillStyle='#09080d99';ctx.beginPath();ctx.ellipse(0,13,27,12,0,0,Math.PI*2);ctx.fill();
let bob=Math.sin(game.time*9)*2;
if(bot.inv>0&&Math.floor(bot.inv*18)%2===0)ctx.globalAlpha=.35;
if(sprite.complete&&sprite.naturalWidth){
ctx.filter=bot.hp/bot.maxHp<.5?'saturate(3) sepia(1) hue-rotate(310deg) saturate(3)':'none';
ctx.drawImage(sprite,-30,-43+bob,60,70);
ctx.filter='none'
}
if(bot.shield>0){
ctx.globalAlpha=.8;ctx.strokeStyle='#48cfff';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke()
}
ctx.restore();ctx.globalAlpha=1;

for(let w of bot.weapons){

const count=Math.min(30,w.count),radius=155+Math.min(65,count*3);
for(let k=0;k<count;k++){
const a=w.a+k*Math.PI*2/count,x=bot.x+Math.cos(a)*radius,y=bot.y+Math.sin(a)*radius;

if(hatSprite.complete&&hatSprite.naturalWidth)ctx.drawImage(hatSprite,-18,-21,36,42);

}
}
}

if(bot.cat){
ctx.save();ctx.translate(bot.cat.x,bot.cat.y);
if(catSprite.complete&&catSprite.naturalWidth)ctx.drawImage(catSprite,-31,-34,62,68);
ctx.restore();
}
}

function drawMinimap(){
if(!game) return;
const p=game.p;
mmCtx.clearRect(0,0,120,120);
mmCtx.save();
mmCtx.beginPath();
mmCtx.arc(60,60,58,0,Math.PI*2);
mmCtx.clip();
mmCtx.fillStyle='rgba(15,15,20,0.8)';
mmCtx.fillRect(0,0,120,120);
const scale=120/1200;
mmCtx.fillStyle='#00ffff';
mmCtx.beginPath();mmCtx.arc(60,60,4,0,Math.PI*2);mmCtx.fill();
for(let bot of game.bots){
    const dx=(bot.x-p.x)*scale;
    const dy=(bot.y-p.y)*scale;
    const mx=60+dx;
    const my=60+dy;
    if(mx>0&&mx<120&&my>0&&my<120){
        mmCtx.fillStyle='#00ff00';
        mmCtx.beginPath();mmCtx.arc(mx,my,3,0,Math.PI*2);mmCtx.fill();
    }
}
for(let e of game.enemies){
    const dx=(e.x-p.x)*scale;
    const dy=(e.y-p.y)*scale;
    const mx=60+dx;
    const my=60+dy;
    if(mx>0&&mx<120&&my>0&&my<120){
        if(e.type==='boss'){
            mmCtx.fillStyle='#ff0000';
            mmCtx.beginPath();mmCtx.arc(mx,my,4,0,Math.PI*2);mmCtx.fill();
        } else {
            mmCtx.fillStyle='#ff8800';
            mmCtx.beginPath();mmCtx.arc(mx,my,2,0,Math.PI*2);mmCtx.fill();
        }
    }
}
mmCtx.restore();
mmCtx.strokeStyle='rgba(255,255,255,0.5)';
mmCtx.lineWidth=2;
mmCtx.beginPath();mmCtx.arc(60,60,58,0,Math.PI*2);mmCtx.stroke();
}

ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0
}

for(let e of g.enemies){
    if(e.type==='boss'){
        drawBoss(e);
    } else {
        drawPolice(e);
    }
}

if(g.cat){
ctx.save();ctx.translate(g.cat.x,g.cat.y);
if(catSprite.complete&&catSprite.naturalWidth)ctx.drawImage(catSprite,-31,-34,62,68);
else{ctx.font='32px Arial';ctx.textAlign='center';ctx.fillText('🐈',0,10)}
ctx.restore();
ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillStyle='#ffcf70';
ctx.fillText('КОТОСТЬ LVL '+g.cat.level,g.cat.x,g.cat.y-40)
}

ctx.save();ctx.translate(p.x,p.y);
ctx.fillStyle='#09080d99';ctx.beginPath();ctx.ellipse(0,13,27,12,0,0,Math.PI*2);ctx.fill();
let bob=Math.sin(g.time*9)*2;
if(p.inv>0&&Math.floor(p.inv*18)%2===0)ctx.globalAlpha=.35;
if(sprite.complete&&sprite.naturalWidth){
ctx.filter=p.hp/p.maxHp<.5?'saturate(3) sepia(1) hue-rotate(310deg) saturate(3)':'none';
ctx.drawImage(sprite,-30,-43+bob,60,70);
ctx.filter='none'
}else{
ctx.fillStyle=p.hp/p.maxHp<.5?'#d52b35':'#267bbd';
ctx.beginPath();ctx.ellipse(0,5,25,15,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e8b18e';ctx.beginPath();ctx.arc(0,-13,14,0,Math.PI*2);ctx.fill()
}
if(p.shield>0){
ctx.globalAlpha=.8;ctx.strokeStyle='#48cfff';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(0,0,40,0,Math.PI*2);ctx.stroke()
}
ctx.restore();ctx.globalAlpha=1;

for(let z of g.particles){
ctx.globalAlpha=Math.max(0,z.t/.65);ctx.fillStyle=z.c;
ctx.beginPath();ctx.arc(z.x,z.y,3,0,Math.PI*2);ctx.fill()
}
ctx.globalAlpha=1;
for(let z of g.texts){
ctx.globalAlpha=Math.max(0,z.t);ctx.fillStyle=z.c;
ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText(z.s,z.x,z.y)
}
ctx.globalAlpha=1;
ctx.restore();

drawMinimap();
}

function gameOver(){
cancelAnimationFrame(raf);stopMusic();
$('overlay').classList.remove('hidden');
const modeText=game.mode==='singleplayer'?`Волна: ${game.wave}`:`Режим: Выживание`;
$('dialog').innerHTML=`<h1>💀 ТЕБЯ ПОЙМАЛИ</h1><p>Интерпол окружил тазик Мелстроя!</p><p>⏱️ Продержался: <b>${Math.floor(game.time)}с</b><br>💀 Агентов побеждено: <b>${game.kills}</b><br>⭐ ${modeText}</p><button id="start" class="btn-start">ЕЩЁ РАЗ!</button>`;
$('start').addEventListener('click',()=>{
    $('dialog').innerHTML=`<h1>MELSTROY: ПОБЕГ</h1><p>Ты — Мелстрой в тазике. Интерпол наступает со всех сторон! Собирай шляпы, прокачивай Котость и выживай.</p><p><b>Управление:</b><br>ПК: WASD / Стрелки + Мышь<br>Телефон: Коснись экрана в любом месте для джойстика.</p><button id="startSingle" class="btn-start">ОДИНОЧНАЯ ИГРА</button><button id="startMulti" class="btn-start btn-multi">МУЛЬТИПЛЕЕР</button>`;
    $('startSingle').addEventListener('click',()=>startGame('singleplayer'));
    $('startMulti').addEventListener('click',()=>startGame('multiplayer'));
});
}

function loop(t){
if(!running||paused)return;
let dt=Math.min(.04,(t-last)/1000||.016);
last=t;update(dt);
if(running){draw();raf=requestAnimationFrame(loop)}
}
})();
</script>
